[project]
name = "hvac-connect-api"
version = "0.1.0"
description = "Backend API for HVAC Connect: on-demand HVAC service matching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "stripe>=11",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Production database driver + faster server (not needed for the SQLite demo).
postgres = [
    "asyncpg>=0.29",
    "uvicorn[standard]>=0.30",
]
dev = [
    "asyncpg>=0.29",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
