name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hvac, POSTGRES_PASSWORD: hvac, POSTGRES_DB: hvac }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hvac" --health-interval 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check app tests && ruff format --check app tests
      - run: mypy app
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres)
        run: pytest -q
        env: { HVAC_TEST_DATABASE_URL: "postgresql+asyncpg://hvac:hvac@localhost:5432/hvac" }
      - name: Migrations match models
        run: alembic upgrade head && alembic check
        env: { HVAC_DATABASE_URL: "postgresql+asyncpg://hvac:hvac@localhost:5432/hvac" }

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit && npx expo export --platform web
        working-directory: mobile
      - run: npm ci
        working-directory: shop-portal
      - run: npm run build
        working-directory: shop-portal
